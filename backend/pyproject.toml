[project]
name = "docintel-backend"
version = "0.1.0"
description = "Document Intelligence Platform — Turn messy documents into structured, queryable data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "pymupdf>=1.25.0",
    "pytesseract>=0.3.13",
    "pillow>=11.0.0",
    "python-docx>=1.1.2",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "python-magic>=0.4.27",
    # LangGraph + LangChain for agentic pipeline
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=0.2.0",
    # Elasticsearch for advanced search
    "elasticsearch[async]==8.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
